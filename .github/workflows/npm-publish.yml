name: Test and publish

# Tests on every push and pull request; publishes @333eco/primitives when
# package.json's version is new on main.
#
# WHY THE PUBLISH IS GATED ON THE TESTS, and not merely ordered after them: the
# package's whole value is that its output recomputes. A version whose vectors
# disagree with its code hands a stranger a verifier that certifies the wrong
# answer — and nothing on the consuming side can tell. The suite also checks the
# code against @333eco/sey@1.0.0's published vectors, so a publish cannot
# silently fork the draw from what sey already shipped.
#
# ⚠️ NEEDS NPM_TOKEN — a granular automation token with publish rights on the
# @333eco scope and 2FA bypass enabled, the same kind as corpus.333.eco's. An
# interactive OTP cannot be supplied to a workflow; a plain token with 2FA
# required fails with E403 and nothing else looks wrong.
#
# ⚠️ A green publish step is not a published package: npm's registry read can lag
# the write. Confirm with `npm view @333eco/primitives@<version>` before
# believing either outcome.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      # The committed vectors must be exactly what the committed code produces.
      - name: Vectors are current
        run: |
          node scripts/generate-vectors.mjs
          git diff --exit-code vectors/ || { echo "::error::vectors/b-call-vectors.json is stale against src/ — run npm run vectors"; exit 1; }

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Publish if this version is new
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "@333eco/primitives@$V" version >/dev/null 2>&1; then
            echo "@333eco/primitives@$V is already published — nothing to do."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
